services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${QIFY_DB_NAME:-qify}
      POSTGRES_USER: ${QIFY_DB_USER:-qify}
      POSTGRES_PASSWORD: ${QIFY_DB_PASSWORD:-qify-local}
    ports:
      - "${QIFY_DB_PORT:-5432}:5432"
    volumes:
      - qify-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qify-postgres-data:
