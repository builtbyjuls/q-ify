spring:
  application:
    name: qify-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 3
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    url: ${SPRING_FLYWAY_URL}
    user: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    validate-migration-naming: true

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
